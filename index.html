<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: linear-gradient(115deg, #eaf2fb, #f7fbf9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 240px;
            height: 320px;
            background-color: #fefefe;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(11,35,60,0.08);
            transition: transform 220ms ease, box-shadow 220ms ease;
        }

        .container:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(11,35,60,0.12);
        }

        .main {
            display: flex;
            justify-content: center;
            align-content: center;
            flex-wrap: wrap;
            width: 100%;
            height: 100%;
        }

        .circle {
            width: 130%;
            height: 52%;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.06);
            position: absolute;
            left: 50%;
            top: 10%;
            transform: translate(-50%, -50%);
            filter: blur(6px);
        }

        .image img {
            z-index: 2;
            position: absolute;
            width: 160px;
            height: 160px;
            top: 10%;
            transform: translateY(6px);
            image-rendering: -webkit-optimize-contrast;
        }

        .hp {
            background-color: rgba(255,255,255,0.9);
            width: 52px;
            height: 28px;
            top: 12px;
            right: 12px;
            border-radius: 10px;
            position: absolute;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            font-size: 12px;
            color: #222;
            box-shadow: 0 6px 16px rgba(12,35,60,0.06);
        }

        .image {
            display: flex;
            justify-content: center;
        }

        .hp span {
            font-size: 8px;
        }

        .name {
            position: absolute;
            z-index: 3;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            letter-spacing: 0.5px;
            font-weight: 600;
            color: #0b234c;
            text-transform: capitalize;
        }

        .type {
            position: absolute;
            z-index: 3;
            top: 72%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            background-color: rgba(255,255,255,0.85);
            border-radius: 999px;
            min-width: 64px;
            padding: 6px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 8px 18px rgba(11,35,60,0.06);
        }

        .stats {
            position: absolute;
            z-index: 1;
            bottom: 5px;
            left: 19%;
            display: flex;
            gap: 15px;
        }

        .stats p:nth-child(2) {
            position: relative;
            left: -8px;
            top: 1px;
            font-size: 12px;
        }

        .input {
            display: flex;
            justify-content: center;
            position: relative;
            gap: 10px;
        }

        .input #input {
            padding: 12px 16px;
            border-radius: 50px;
            border: none;
            width: 220px;
            box-shadow: 0 8px 20px rgba(11,35,60,0.06);
        }

        .input button {
            border-radius: 20px;
            width: 80px;
            border: none;
            background: linear-gradient(90deg,#4facfe,#00f2fe);
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(79,172,254,0.18);
        }

        .main {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Toast styles */
        .toast-container {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        .toast {
            min-width: 220px;
            max-width: 320px;
            padding: 12px 16px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 8px 22px rgba(12,35,60,0.12);
            transform: translateX(20px);
            opacity: 0;
            animation: slideIn 360ms forwards;
        }

        .toast--error { background: linear-gradient(90deg,#ff7b7b,#ff6a6a); }
        .toast--info  { background: linear-gradient(90deg,#4facfe,#00f2fe); }

        @keyframes slideIn {
            to { transform: translateX(0); opacity: 1; }
        }
       
        .app {
            width: min(1100px, 96%);
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 36px;
            align-items: start;
        }

        .hero {
            padding: 28px 12px;
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            color: #073b6b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #15507a;
            opacity: 0.9;
            margin-bottom: 18px;
            font-size: 16px;
        }

        .main {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
            align-items: start;
            justify-content: start;
            max-height: 720px;
            overflow: auto;
            padding: 12px;
            background: rgba(255,255,255,0.6);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(11,35,60,0.06);
        }

        .search-col { display:flex; flex-direction:column; gap:12px; align-items: start; }

        .container .gloss{ position:absolute; inset:0; background:linear-gradient(120deg, rgba(255,255,255,0.18), rgba(255,255,255,0)); mix-blend-mode: overlay; pointer-events:none; border-radius:16px }
    </style>
</head>

<body>
    <div class="app">
        <div class="hero">
            <div class="title">Pokémon Cards</div>
            <div class="subtitle">Search any Pokémon to reveal a beautiful card. Try &quot;pikachu&quot; or &quot;charizard&quot;.</div>
            <div class="search-col">
                <div class="input">
                        <input type="text" placeholder="Enter Pokémon name" id="input">
                        <button onclick="fetchData()">Search</button>
                </div>
            </div>
        </div>
        <div class="main">

        </div>
    </div>
    <script>
        function getHexForColor(color) {
            const map = {
                black: '#2b2b2b',
                blue: '#7db9ff',
                brown: '#b56b3a',
                gray: '#bdbdbd',
                green: '#7bd389',
                pink: '#f7a7c0',
                purple: '#c99bff',
                red: '#ff7b7b',
                white: '#ffffff',
                yellow: '#ffea7d'
            };
            return map[color] || '#fefefe';
        }

        // slight shade/darken function for hex colors
        function shadeHex(hex, percent) {
            try {
                hex = hex.replace('#', '');
                const num = parseInt(hex, 16);
                const r = Math.min(255, Math.max(0, (num >> 16) + percent));
                const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent));
                const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent));
                return `#${(r<<16 | g<<8 | b).toString(16).padStart(6,'0')}`;
            } catch (e) {
                return hex;
            }
        }

        // toast helper
        function showToast(message, type = 'info', timeout = 3500) {
            const container = document.querySelector('.toast-container') || (function(){
                const c = document.createElement('div');
                c.className = 'toast-container';
                document.body.appendChild(c);
                return c;
            })();
            const t = document.createElement('div');
            t.className = `toast toast--${type}`;
            t.textContent = message;
            container.appendChild(t);
            setTimeout(() => {
                t.style.transition = 'transform 240ms, opacity 240ms';
                t.style.transform = 'translateX(20px)';
                t.style.opacity = '0';
            }, timeout - 300);
            setTimeout(() => t.remove(), timeout);
        }

        function createCards(hp, image, name, type, attack, defense, speed, color) {
            const bg = getHexForColor(color);
            const darker = shadeHex(bg, -60);
            const circleBg = shadeHex(bg, -24);
            const typeBg = shadeHex(bg, -36);
            clutter = `<div class="container" style="background: linear-gradient(135deg, ${bg}, ${darker}); border: 1px solid rgba(255,255,255,0.08);">
            <div class="gloss"></div>
            <div class="hp">
                <h6><span>HP </span>${hp}</h6>
            </div>
            <div class="circle" style="background:${circleBg}"></div>
            <div class="image">
                <img src="${image}" alt="${name}">
            </div>
            <div class="name">
                <h4>${name}</h4>
            </div>
            <div class="type" style="background:${typeBg}; color: #fff;">
                <p>${type}</p>
            </div>
            <div class="stats" style="display:flex; gap:12px; position:absolute; z-index:3; bottom:12px; left:50%; transform:translateX(-50%);">
                <div style="text-align:center; color:rgba(255,255,255,0.95);">
                    <div style="font-weight:700">${attack}</div>
                    <div style="font-size:11px; opacity:0.9;">Attack</div>
                </div>
                <div style="text-align:center; color:rgba(255,255,255,0.95);">
                    <div style="font-weight:700">${defense}</div>
                    <div style="font-size:11px; opacity:0.9;">Defense</div>
                </div>
                <div style="text-align:center; color:rgba(255,255,255,0.95);">
                    <div style="font-weight:700">${speed}</div>
                    <div style="font-size:11px; opacity:0.9;">Speed</div>
                </div>
            </div>
        </div>`
            document.querySelector(".main").innerHTML = clutter;
        }

        async function fetchData() {
            try {
                let name = document.querySelector("#input").value.trim().toLowerCase()
                if (!name) {
                    showToast('Please enter a Pokémon name', 'info');
                    return;
                }
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`)
                if (response.status == 404) {
                    throw new Error("Pokemon not found");
                }
                if (!response.ok) {
                    throw new Error("Something went wrong");
                }
                const json_response = await response.json()
                console.log(json_response);

                const image_url = json_response.sprites.front_default;
                const hp = json_response.stats[0].base_stat;
                const attack = json_response.stats[1].base_stat;
                const defense = json_response.stats[2].base_stat;
                const speed = json_response.stats[5].base_stat;
                const type = json_response.types[0].type.name;
                const speciesResp = await fetch(json_response.species.url)
                const speciesJson = await speciesResp.json()
                const speciesColor = speciesJson.color?.name || 'white'
                createCards(hp, image_url, name, type, attack, defense, speed, speciesColor);

            } catch (error) {
                console.error(error)
                showToast(error.message || 'Pokemon not found', 'error');
            }
        }
        // Enter key support
        document.querySelector('#input').addEventListener('keydown', function(e){
            if (e.key === 'Enter') fetchData();
        });
    </script>
</body>

</html>
